<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mrvhGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#a824ec" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @font-face {
        font-family: 'Ethnocentric';
        src: url('/assets/fonts/Ethnocentric.woff2') format('woff2');
      }
      .mrvh-text {
        font-family: 'Ethnocentric', 'Space Grotesk', sans-serif;
        font-size: 155px;
        font-weight: 700;
        fill: url(#mrvhGoldGrad);
        filter: drop-shadow(0 0 18px rgba(168, 36, 236, 0.5));
      }
      .divider-line {
        stroke: #d4af37;
        stroke-width: 3.5;
        stroke-linecap: round;
        opacity: 0.8;
      }
      .ventures-text {
        font-family: 'Space Grotesk', 'Inter', -apple-system, sans-serif;
        font-size: 32px;
        font-weight: 600;
        letter-spacing: 0.38em;
        fill: #f3f4f6;
        text-anchor: end;
      }
    </style>
  </defs>

  <!-- MRVH Core Monolith -->
  <text x="80" y="220" class="mrvh-text">MRVH</text>

  <!-- Hairline Alignment Divider (between R/V junction to end of H) -->
  <line x1="490" y1="255" x2="920" y2="255" class="divider-line" />

  <!-- VENTURES Underneath Flush -->
  <text x="920" y="300" class="ventures-text">VENTURES</text>
</svg>